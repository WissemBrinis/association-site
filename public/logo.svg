<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <!-- Icon: cave arch + descending figure -->
  <g transform="translate(10, 10)">
    <!-- Cave arch -->
    <path d="M 10 90 Q 10 20 50 20 Q 90 20 90 90 L 75 90 Q 75 35 50 35 Q 25 35 25 90 Z"
          fill="#1E3A5F"/>
    <!-- Inner cave darkness -->
    <ellipse cx="50" cy="80" rx="18" ry="12" fill="#0F1E33"/>
    <!-- Descending figure (simplified) -->
    <circle cx="50" cy="58" r="5" fill="#D97706"/>
    <path d="M 50 63 L 50 78 M 50 68 L 44 74 M 50 68 L 56 74 M 50 78 L 46 88 M 50 78 L 54 88"
          stroke="#D97706" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Headlamp beam -->
    <path d="M 50 54 L 38 46 L 42 58 Z" fill="#D97706" opacity="0.6"/>
  </g>

  <!-- Text: French name -->
  <text x="120" y="55" font-family="system-ui, -apple-system, sans-serif"
        font-size="24" font-weight="700" fill="#1E3A5F">
    Spéléo Tunisie
  </text>

  <!-- Text: Arabic name -->
  <text x="120" y="85" font-family="system-ui, -apple-system, sans-serif"
        font-size="18" font-weight="500" fill="#78716C"
        direction="rtl">
    الجمعية التونسية للاستغوار
  </text>
</svg>